vendor: zte
device_type: switch

# 根视图（全局配置视图）
root_view: configure terminal

# 退出当前视图 / 回到用户视图
view_exit: exit
view_return: return

# 配置删除前缀
negation_prefix: "no"

# 显示命令关键字：源侧用于识别，目标侧用于生成
display_prefix: show

# 中兴 ZXR10 默认按需显式退出视图
allow_direct_view_switch: false

# 配置末尾自动逐层退出并回到用户视图
auto_close_views: true
