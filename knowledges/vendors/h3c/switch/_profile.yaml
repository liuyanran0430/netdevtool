vendor: h3c
device_type: switch

# 根视图（全局配置视图）
root_view: system-view

# 退出当前视图 / 回到用户视图
view_exit: quit
view_return: return

# 配置删除前缀
negation_prefix: undo

# 显示命令关键字：源侧用于识别，目标侧用于生成
display_prefix: display

# 华三 Comware 不允许从接口视图内直接切换到另一个接口视图
allow_direct_view_switch: false

# 配置末尾自动逐层退出并回到用户视图
auto_close_views: true
