id: port_trunk_vlan
domain: vlan
description: "将接口配置为 trunk 模式并放行指定 VLAN"
view_path: ["system-view", "interface {intf}"]
parameters:
  intf:
    type: string
    required: true
  vlan_list:
    type: string
    format: vlan_list
    required: true
    note: "VLAN 列表，如 '10 20 30' 或范围 '10 to 20'"
semantic_notes:
  - "华为/华三使用 port 风格；中兴使用 switchport 风格"
  - "华为命令为 allow-pass，华三为 permit，中兴为 trunk vlan"